[package]
name = "rustquery"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "RustQuery — a fast desktop SQL workbench for PostgreSQL, MySQL and SQLite"
authors = ["Gokul Raj <gokulraj.kana@gmail.com>"]
license = "MIT"
readme = "README.md"

[dependencies]
# Desktop UI -------------------------------------------------------------------
eframe = { version = "0.31.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui_extras = "0.31.1"
rfd = "0.17.2"
unicode-width = "0.2"

# Async runtime ----------------------------------------------------------------
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures-util = "0.3"

# Databases --------------------------------------------------------------------
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-native-tls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "json",
    "bigdecimal",
] }
bigdecimal = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Persistence ------------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Clipboard & errors -----------------------------------------------------------
arboard = "3"
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = 1
